# goreleaser config — runs on tag push (release-please creates the tag when
# its Release PR merges). Builds cross-platform binaries, appends them to
# the GitHub Release that release-please already created, and updates the
# Homebrew formulas in wbern/homebrew-tap. Separate archives and formula
# binaries let existing adr-lint installations upgrade and coexist with adrian.
#
# Local validation: goreleaser check
# Local dry-run:    goreleaser release --snapshot --clean

version: 2

project_name: adrian

before:
  hooks:
    - go -C go mod tidy

builds:
  - id: adrian
    main: ./cmd/adrian
    dir: go
    binary: adrian
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/wbern/adrian/go/internal/versioncmd.version={{ .Version }}
  - id: adr-lint
    main: ./cmd/adr-lint
    dir: go
    binary: adr-lint
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/wbern/adrian/go/internal/versioncmd.version={{ .Version }}

archives:
  - id: adrian
    ids: [adrian]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - CHANGELOG.md
      - doc/adr/templates/template.md
  - id: adr-lint
    ids: [adr-lint]
    name_template: >-
      adr-lint_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - CHANGELOG.md
      - doc/adr/templates/template.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  # release-please already wrote the changelog into the GitHub Release body.
  # Disable goreleaser's auto-generated section so we don't double up.
  disable: true

release:
  # release-please creates the GitHub Release first; we append artifacts.
  mode: append
  draft: false
  prerelease: auto

brews:
  - name: adrian
    ids: [adrian]
    repository:
      owner: wbern
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/wbern/adrian"
    description: "Validate architecture decisions and derive review requirements from ADRs."
    license: "MIT"
    install: |
      bin.install "adrian"
    test: |
      system "#{bin}/adrian", "version"
      system "#{bin}/adrian", "plan", "--help"
  - name: adr-lint
    ids: [adr-lint]
    repository:
      owner: wbern
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/wbern/adrian"
    description: "Compatibility command for ADRian architecture decision tooling."
    license: "MIT"
    caveats: |
      adr-lint is the deprecated command name for ADRian, with the same implementation.
      Install wbern/tap/adrian and update scripts to use adrian when convenient.
      Both formulas can be installed together; this formula continues to receive updates.
    install: |
      bin.install "adr-lint"
    test: |
      system "#{bin}/adr-lint", "version"
      system "#{bin}/adr-lint", "plan", "--help"
